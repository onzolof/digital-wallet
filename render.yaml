# Render Blueprint — create the service from the dashboard via "New > Blueprint"
# and connect this repo. Turn off "Auto-Deploy" on the web service so only the
# GitHub Actions deploy job (after tests) triggers deploys via the deploy hook.
services:
  - type: web
    name: digital-wallet-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /digital-wallet/actuator/health
    envVars:
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false