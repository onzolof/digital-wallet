openapi: 3.0.3
info:
  title: Digital Wallet API
  version: 0.1.0
paths:
  /accounts:
    get:
      operationId: getAccountOverview
      tags:
        - Accounts
      summary: Account overview for the current user
      responses:
        "200":
          description: Account overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOverview"
  /accounts/{accountId}:
    get:
      operationId: getAccount
      tags:
        - Accounts
      summary: One account
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Account not found
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
  schemas:
    AccountOverview:
      type: object
      required:
        - userId
        - username
        - totalBalanceChf
        - accounts
      properties:
        userId:
          type: string
        username:
          type: string
        totalBalanceChf:
          type: number
          description: Total balance in CHF, as a decimal.
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/MinimalAccount"
    MinimalAccount:
      type: object
      required:
        - userId
        - username
        - accountId
        - currency
        - accountCategory
        - totalBalance
        - totalBalanceChf
      properties:
        userId:
          type: string
        username:
          type: string
        accountId:
          type: string
        currency:
          type: string
        accountCategory:
          type: string
        totalBalance:
          type: number
          description: Account balance in the account currency, as a decimal.
        totalBalanceChf:
          type: number
          description: Account balance in CHF, as a decimal.
    Account:
      type: object
      required:
        - userId
        - username
        - accountId
        - currency
        - accountType
        - accountCategory
        - totalBalance
        - totalBalanceChf
        - transactions
      properties:
        userId:
          type: string
        username:
          type: string
        accountId:
          type: string
        currency:
          type: string
        accountType:
          type: string
        accountCategory:
          type: string
        totalBalance:
          type: number
        totalBalanceChf:
          type: number
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
    Transaction:
      type: object
      required:
        - accountId
        - transactionId
        - amount
        - amountRounded
        - currency
        - creditDebitIndicator
        - status
        - bookingDateTime
        - transactionInformation
      properties:
        accountId:
          type: string
        transactionId:
          type: string
        amount:
          type: number
        amountRounded:
          type: number
        currency:
          type: string
        creditDebitIndicator:
          type: string
        status:
          type: string
        bookingDateTime:
          type: string
          format: date-time
        transactionInformation:
          type: string
